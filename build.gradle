plugins {
  id 'java-library'

  // required for publishing to Maven Central
  id 'com.vanniktech.maven.publish' version '0.37.0'
}

java {
  sourceCompatibility = '25'
  targetCompatibility = '25'
}

repositories {
  mavenCentral()
}

dependencies {
  // dependencies for implementations
  implementation 'com.microsoft.sqlserver:mssql-jdbc:13.4.0.jre11'
  implementation 'com.tngtech.archunit:archunit:1.5.0'
  implementation 'io.netty:netty-all:4.2.17.Final'

  // dependencies for tests
  testImplementation 'net.bytebuddy:byte-buddy:1.18.11'
  testImplementation 'net.bytebuddy:byte-buddy-agent:1.18.11'
  testImplementation 'org.junit.jupiter:junit-jupiter-api:6.1.3'
  testImplementation 'org.junit.jupiter:junit-jupiter-engine:6.1.3'
  testImplementation 'org.junit.jupiter:junit-jupiter-params:6.1.3'
  testImplementation 'org.junit.platform:junit-platform-launcher:6.1.3'
  testImplementation 'org.mockito:mockito-core:5.23.0'
}

sourceSets {
  main {
    java {
      srcDirs = ['Source']
    }

    resources {
      srcDirs = ['Resource']
    }
  }

  test {
    java {
      srcDirs = ['Test', 'ArchitectureTest', 'PerformanceTest']
    }

    resources {
      srcDirs = ['TestResource']
    }
  }
}

test {
  useJUnitPlatform()
}

// required for publishing to Maven Central
mavenPublishing {
  publishToMavenCentral()
  signAllPublications()
  coordinates("ch.nolix", "nolix", "0.0.0")

  pom {
    name = 'Nolix'
    description = 'Nolix provides a web framework.'
    url = 'https://github.com/silvanwyss/nolix'

    licenses {
      license {
        name = 'MIT License'
        url = 'https://opensource.org/license/mit'
      }
    }

    developers {
      developer {
        id = 'SilvanWyss'
        name = 'Silvan Wyss'
        email = 'silvan.wyss@gmail.com'
      }
    }

    scm {
      connection = 'scm:git:git://github.com'
      developerConnection = 'scm:git:ssh://github.com:silvanWyss/nolix.git'
      url = 'https://github.com'
    }
  }
}
